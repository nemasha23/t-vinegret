services:
  - type: web
    name: t-vinegret
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
